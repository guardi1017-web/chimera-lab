<title>키메라 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap">
<style>
  /* 배치: 화면 전체가 판이다. 글은 시작과 끝의 덮개에만 있고, 판 중에는 위쪽 띠 하나만 남는다. */
  :root {
    --ground: #15121c;   /* 밤의 실험실 바닥 */
    --grid: #2a2536;
    --ink: #ece4d4;      /* 양피지 */
    --dim: #8f869c;
    --necro: #a077ff;    /* 네크로맨서 */
    --bone: #d8cfbb;     /* 키메라의 맨몸 */
    --wolf: #e8893a;
    --knight: #6fa6dc;
    --archer: #83c06b;
    --danger: #e5524c;
    --veil: rgba(21, 18, 28, 0.88);
    --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; overflow: hidden; }
  #stage { position: relative; height: 100%; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }
  .veil {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px;
    background: var(--veil);
    padding-block: 24px;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    overflow-y: auto;
  }
  .veil > * { max-width: 26rem; width: 100%; margin-inline: auto; }
  h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
  h1 { font-size: 2.25rem; }
  h2 { font-size: 2rem; }
  p { margin: 0; }
  .how { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .how li { display: grid; grid-template-columns: 1.5rem 1fr; gap: 12px; align-items: center; }
  .swatch { width: 1.1rem; height: 1.1rem; justify-self: center; }
  .swatch.wolf { background: var(--wolf); clip-path: polygon(100% 50%, 0 100%, 25% 50%, 0 0); }
  .swatch.knight { background: var(--knight); }
  .swatch.archer { background: var(--archer); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .note { color: var(--dim); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; margin: 0; font-variant-numeric: tabular-nums; }
  dt { color: var(--dim); }
  dd { margin: 0; }
  #endChimeras { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  button {
    font: inherit; font-family: var(--font-display); font-size: 1.25rem; color: var(--ground); background: var(--ink);
    border: 0; padding: 14px 20px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--necro); outline-offset: 3px; }
</style>

<div id="stage">
  <canvas id="game" aria-label="키메라 실험 판"></canvas>

  <section class="veil" id="title">
    <h1>키메라 실험실</h1>
    <p>네크로맨서를 움직이면 키메라 셋이 따라와 알아서 싸운다. 적이 떨어뜨린 부위를 밟으면 키메라에게 붙는다. 90초를 버텨라.</p>
    <ul class="how">
      <li><span class="swatch wolf"></span><span>늑대의 부위는 빠르게 만든다</span></li>
      <li><span class="swatch knight"></span><span>기사의 부위는 단단하게 만든다</span></li>
      <li><span class="swatch archer"></span><span>궁수의 부위는 멀리 닿게 만든다</span></li>
    </ul>
    <p class="note">세모는 머리, 막대는 팔, 점 둘은 다리. 키메라를 톡 누르면 그 키메라가 다음 부위를 받는다. 다시 누르면 풀린다.</p>
    <button id="startBtn" type="button">시작</button>
  </section>

  <section class="veil" id="end" hidden>
    <h2 id="endTitle">쓰러졌다</h2>
    <dl>
      <dt>버틴 시간</dt><dd id="endTime">0초</dd>
      <dt>잡은 적</dt><dd id="endKills">0마리</dd>
      <dt>붙인 부위</dt><dd id="endParts">0개</dd>
    </dl>
    <ul id="endChimeras"></ul>
    <button id="againBtn" type="button">한 판 더</button>
  </section>
</div>

<script>
// 키메라 실험: 규칙만 담는다(화면·DOM 없음). 같은 시드면 같은 판이 나온다.
(function (root) {
  'use strict';
  const W = 18, H = 30, DURATION = 90;
  const SLOTS = ['head', 'arm', 'leg'];
  const ENEMY = {
    wolf:   { hp: 16, spd: 4.5, dmg: 4,  cd: 0.7, range: 0.25, r: 0.42 },
    knight: { hp: 80, spd: 2.0, dmg: 10, cd: 1.2, range: 0.3,  r: 0.62 },
    archer: { hp: 20, spd: 2.8, dmg: 5,  cd: 1.8, range: 5.5,  r: 0.42 },
  };
  const NECRO_SPEED = 5.0, LEASH = 6.5, PICK_RADIUS = 1.1;

  function mulberry(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function partCount(c) { return SLOTS.reduce((n, s) => n + (c.parts[s] ? 1 : 0), 0); }

  // 부위가 키메라를 어떻게 바꾸는지는 여기 한 곳에만 있다.
  function stats(c) {
    const p = c.parts;
    const s = { maxHp: 70, spd: 5.8, dmg: 8, cd: 0.8, range: 0.3, taken: 1, taunt: false, knock: 0, ranged: false };
    if (p.arm === 'wolf') s.dmg += 5;                         // 발톱
    if (p.arm === 'knight') s.taken = 0.5;                    // 방패
    if (p.arm === 'archer') { s.ranged = true; s.range = 6; } // 활
    if (p.head === 'wolf') s.cd *= 0.5;                       // 물어뜯기 연타
    if (p.head === 'knight') s.maxHp += 70;                   // 투구
    if (p.head === 'archer') s.dmg *= 1.6;                    // 매의 눈
    if (p.leg === 'wolf') s.spd *= 1.5;                       // 질주
    if (p.leg === 'knight') { s.taunt = true; s.knock = 0.9; } // 버티고 서서 적을 끈다
    if (p.leg === 'archer') s.range += 2;                     // 긴 다리로 멀리 닿는다
    return s;
  }

  function newGame(seed) {
    const g = {
      W, H, DURATION, t: 0, over: null, rand: mulberry(seed || 1),
      necro: { x: W / 2, y: H * 0.6, hp: 100, maxHp: 100, r: 0.5, hurt: 0 },
      chimeras: [], enemies: [], parts: [], fx: [],
      spawnT: 1.2, kills: 0, picked: 0, spawned: 0,
      target: null,   // 부위를 받을 키메라(없으면 빈 칸 먼저)
    };
    for (let i = 0; i < 3; i++) {
      const a = Math.PI / 2 + i * Math.PI * 2 / 3;
      g.chimeras.push({
        id: i, x: g.necro.x + Math.cos(a) * 1.5, y: g.necro.y + Math.sin(a) * 1.5,
        hp: 70, r: 0.7, parts: { head: null, arm: null, leg: null }, at: { head: -1, arm: -1, leg: -1 },
        cd: 0, down: 0, pop: 0, face: -Math.PI / 2,
      });
    }
    return g;
  }

  function moveToward(o, tx, ty, d) {
    const dx = tx - o.x, dy = ty - o.y, m = Math.hypot(dx, dy);
    if (m < 1e-4) return;
    const k = Math.min(1, d / m);
    o.x += dx * k; o.y += dy * k;
    o.face = Math.atan2(dy, dx);
  }

  function spawn(g, dt) {
    g.spawnT -= dt;
    if (g.spawnT > 0 || g.enemies.length >= 36) return;
    const k = g.t / DURATION, r = g.rand();
    g.spawnT = (1.45 - 0.82 * k) * (0.8 + 0.4 * g.rand());
    let type = 'wolf';
    if (g.t >= 12 && g.t < 38) type = r < 0.65 ? 'wolf' : 'archer';
    else if (g.t >= 38) type = r < 0.45 ? 'wolf' : r < 0.72 ? 'archer' : 'knight';
    const n = type === 'wolf' && g.t > 30 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      let x = 0, y = 0;
      for (let tries = 0; tries < 6; tries++) {
        const side = Math.floor(g.rand() * 4), u = g.rand();
        x = side === 0 ? 0.4 : side === 1 ? W - 0.4 : u * W;
        y = side === 2 ? 0.4 : side === 3 ? H - 0.4 : u * H;
        if (Math.hypot(x - g.necro.x, y - g.necro.y) > 7) break;
      }
      const def = ENEMY[type];
      g.enemies.push({ type, x, y, hp: def.hp, maxHp: def.hp, r: def.r, cd: 0.4, face: 0 });
      g.spawned++;
    }
  }

  function hurtChimera(g, c, dmg) {
    const s = stats(c);
    if (s.taken < 1) g.fx.push({ k: 'block', x: c.x, y: c.y, face: c.face, r: c.r, t: 0.18 });
    c.hp -= dmg * s.taken;
    if (c.hp <= 0) { c.hp = 0; c.down = 6; g.fx.push({ k: 'down', x: c.x, y: c.y, t: 0.5 }); }
  }

  function killEnemy(g, e) {
    g.kills++;
    g.fx.push({ k: 'die', x: e.x, y: e.y, type: e.type, t: 0.35 });
    // 처음 세 마리는 반드시 부위를 떨어뜨린다. 붙는 것을 바로 보게 하려는 것이다.
    if ((g.kills <= 3 || g.rand() < 0.55) && g.parts.length < 8) {
      const slot = SLOTS[Math.floor(g.rand() * 3)];
      g.parts.push({ x: clamp(e.x, 0.8, W - 0.8), y: clamp(e.y, 0.8, H - 0.8), type: e.type, slot, ttl: 10 });
    }
  }

  function pickup(g, p) {
    // 빈 칸이 있는 키메라 먼저, 없으면 그 칸을 가장 오래 쓴 키메라(같은 부위는 건너뛴다).
    let c = g.target === null ? g.chimeras.find(c => !c.parts[p.slot]) : (g.chimeras[g.target].parts[p.slot] === p.type ? null : g.chimeras[g.target]);
    if (!c && g.target === null) {
      c = g.chimeras.filter(c => c.parts[p.slot] !== p.type).sort((a, b) => a.at[p.slot] - b.at[p.slot])[0];
    }
    if (!c) {
      g.necro.hp = Math.min(g.necro.maxHp, g.necro.hp + 5);
      g.fx.push({ k: 'heal', x: g.necro.x, y: g.necro.y, t: 0.4 });
      return;
    }
    const before = stats(c).maxHp;
    c.parts[p.slot] = p.type; c.at[p.slot] = g.t;
    const after = stats(c).maxHp;
    if (c.down <= 0) c.hp = Math.min(after, c.hp + (after - before) + 15);
    c.r = 0.7 + 0.12 * partCount(c);
    c.pop = 0.6;
    g.picked++;
    g.fx.push({ k: 'attach', x: p.x, y: p.y, tx: c.x, ty: c.y, type: p.type, id: c.id, t: 0.45 });
  }

  function step(g, dt, inp) {
    if (g.over) return;
    g.t += dt;
    const n = g.necro;
    let mx = (inp && inp.x) || 0, my = (inp && inp.y) || 0;
    const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    n.x = clamp(n.x + mx * NECRO_SPEED * dt, 0.6, W - 0.6);
    n.y = clamp(n.y + my * NECRO_SPEED * dt, 0.6, H - 0.6);
    n.hurt = Math.max(0, n.hurt - dt);

    spawn(g, dt);

    for (const c of g.chimeras) {
      c.pop = Math.max(0, c.pop - dt);
      if (c.down > 0) {
        c.down -= dt;
        if (c.down <= 0) {
          c.down = 0; c.hp = stats(c).maxHp * 0.5;
          g.fx.push({ k: 'attach', x: c.x, y: c.y, tx: c.x, ty: c.y, type: 'bone', id: c.id, t: 0.3 });
        }
        continue;
      }
      const s = stats(c);
      c.cd -= dt;
      let best = null, bd = 1e9;
      for (const e of g.enemies) {
        if (e.hp <= 0 || dist(e, n) > LEASH) continue;
        const d = dist(e, c);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) {
        const reach = s.range + best.r + c.r;
        if (bd > reach) moveToward(c, best.x, best.y, s.spd * dt);
        else c.face = Math.atan2(best.y - c.y, best.x - c.x);
        if (bd <= reach + 0.1 && c.cd <= 0) {
          c.cd = s.cd;
          best.hp -= s.dmg;
          if (s.ranged) g.fx.push({ k: 'shot', x: c.x, y: c.y, tx: best.x, ty: best.y, type: 'archer', t: 0.2 });
          else g.fx.push({ k: 'hit', x: best.x, y: best.y, t: 0.15, bite: c.parts.head === 'wolf', claw: c.parts.arm === 'wolf' });
          if (s.knock > 0) g.fx.push({ k: 'knock', x: c.x, y: c.y, r: c.r, t: 0.2 });
          if (s.knock > 0 && best.hp > 0) {
            const a = Math.atan2(best.y - c.y, best.x - c.x);
            best.x = clamp(best.x + Math.cos(a) * s.knock, 0.4, W - 0.4);
            best.y = clamp(best.y + Math.sin(a) * s.knock, 0.4, H - 0.4);
          }
          if (best.hp <= 0) killEnemy(g, best);
        }
      } else {
        const a = Math.PI / 2 + c.id * Math.PI * 2 / 3;
        const tx = n.x + Math.cos(a) * 1.5, ty = n.y + Math.sin(a) * 1.5;
        if (Math.hypot(tx - c.x, ty - c.y) > 0.15) moveToward(c, tx, ty, s.spd * dt);
      }
    }

    for (const e of g.enemies) {
      if (e.hp <= 0) continue;
      const def = ENEMY[e.type];
      e.cd -= dt;
      // 적은 네크로맨서를 노린다. 길을 막은 키메라나 적을 끄는 키메라가 있으면 그쪽과 싸운다.
      let tgt = n, isNecro = true, td = dist(e, n);
      for (const c of g.chimeras) {
        if (c.down > 0) continue;
        const d = dist(e, c);
        const pull = stats(c).taunt ? 5 : (e.type === 'archer' ? 0 : c.r + e.r + 0.5);
        if (d < pull && (isNecro || d < td)) { tgt = c; isNecro = false; td = d; }
      }
      const reach = def.range + tgt.r + e.r;
      if (td > reach * (e.type === 'archer' ? 0.9 : 1)) moveToward(e, tgt.x, tgt.y, def.spd * dt);
      else e.face = Math.atan2(tgt.y - e.y, tgt.x - e.x);
      if (td <= reach + 0.1 && e.cd <= 0) {
        e.cd = def.cd;
        if (e.type === 'archer') g.fx.push({ k: 'shot', x: e.x, y: e.y, tx: tgt.x, ty: tgt.y, type: 'danger', t: 0.12 });
        if (isNecro) { n.hp -= def.dmg; n.hurt = 0.25; }
        else hurtChimera(g, tgt, def.dmg);
      }
    }

    // 서로 겹치지 않게 살짝 민다.
    const bodies = g.enemies.filter(e => e.hp > 0).concat(g.chimeras.filter(c => c.down <= 0));
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) {
        const a = bodies[i], b = bodies[j];
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = (a.r + b.r) * 0.9;
        if (d < min && d > 1e-4) {
          const push = (min - d) * 0.5, ux = dx / d, uy = dy / d;
          a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push;
        }
      }
    }

    for (const p of g.parts) {
      p.ttl -= dt;
      if (p.ttl > 0 && dist(p, n) < PICK_RADIUS) { pickup(g, p); p.ttl = 0; }
    }
    g.parts = g.parts.filter(p => p.ttl > 0);
    g.enemies = g.enemies.filter(e => e.hp > 0);
    for (const f of g.fx) f.t -= dt;
    g.fx = g.fx.filter(f => f.t > 0);

    if (n.hp <= 0) { n.hp = 0; g.over = 'lose'; }
    else if (g.t >= DURATION) { g.t = DURATION; g.over = 'win'; }
  }

  // 같은 키메라를 다시 고르면 지정이 풀린다.
  function setTarget(g, id) { g.target = g.target === id ? null : id; }

  const api = { W, H, DURATION, SLOTS, ENEMY, newGame, step, stats, partCount, setTarget };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.ChimeraSim = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 화면과 입력. 규칙은 sim.js에 있고 여기서는 상태를 그리기만 한다.
(function () {
  'use strict';
  const S = window.ChimeraSim;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  const COL = {
    ground: C('--ground'), grid: C('--grid'), ink: C('--ink'), dim: C('--dim'), necro: C('--necro'),
    bone: C('--bone'), wolf: C('--wolf'), knight: C('--knight'), archer: C('--archer'), danger: C('--danger'),
  };
  const NAME = { wolf: '늑대', knight: '기사', archer: '궁수' };
  const SLOT_NAME = { head: '머리', arm: '팔', leg: '다리' };
  const titleEl = document.getElementById('title'), endEl = document.getElementById('end');
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let g = null, mode = 'title', inp = { x: 0, y: 0 }, stick = null, keys = {}, last = 0;
  const VIEW_W = 13;   // 화면 가로에 들어오는 판의 폭. 판 전체(18)보다 좁혀 모든 것이 크게 보인다.
  let slow = 0, lastPicked = 0, camX = 0, camY = 0;
  let scale = 1, ox = 0, oy = 0, dpr = 1, seed = (Date.now() % 100000) + 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    scale = cv.width / VIEW_W;
    ox = (cv.width - S.W * scale) / 2;
    oy = (cv.height - S.H * scale) / 2;
  }
  window.addEventListener('resize', resize);

  function start() {
    g = S.newGame(seed++);
    lastPicked = 0; slow = 0;
    mode = 'play';
    titleEl.hidden = true; endEl.hidden = true;
    inp.x = inp.y = 0; stick = null;
  }
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);

  // 화면 아무 곳이나 누르고 끌면 그 방향으로 움직인다.
  cv.addEventListener('pointerdown', e => {
    if (mode !== 'play') return;
    cv.setPointerCapture(e.pointerId);
    stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, at: performance.now(), far: 0 };
  });
  cv.addEventListener('pointermove', e => {
    if (!stick || e.pointerId !== stick.id) return;
    stick.x = e.clientX; stick.y = e.clientY;
    stick.far = Math.max(stick.far, Math.hypot(stick.x - stick.x0, stick.y - stick.y0));
  });
  const lift = e => { if (stick && e.pointerId === stick.id) stick = null; };
  // 짧게 톡 누른 것은 이동이 아니라 고르기다: 가까운 키메라가 다음 부위를 받는다.
  cv.addEventListener('pointerup', e => {
    if (!stick || e.pointerId !== stick.id || mode !== 'play') return;
    if (performance.now() - stick.at < 280 && stick.far < 12) {
      const r = cv.getBoundingClientRect();
      const wx = (e.clientX - r.left) * dpr / scale + camX, wy = (e.clientY - r.top) * dpr / scale + camY;
      let best = null, bd = 1.8;
      for (const c of g.chimeras) { const d = Math.hypot(c.x - wx, c.y - wy); if (d < bd) { bd = d; best = c; } }
      if (best) S.setTarget(g, best.id);
    }
  });
  cv.addEventListener('pointerup', lift);
  cv.addEventListener('pointercancel', lift);
  window.addEventListener('keydown', e => { keys[e.key] = true; });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function readInput() {
    let x = 0, y = 0;
    if (stick) {
      const R = 56;
      x = (stick.x - stick.x0) / R; y = (stick.y - stick.y0) / R;
      const m = Math.hypot(x, y);
      if (m < 0.15) { x = 0; y = 0; } else if (m > 1) { x /= m; y /= m; }
    }
    if (keys.ArrowLeft || keys.a) x -= 1;
    if (keys.ArrowRight || keys.d) x += 1;
    if (keys.ArrowUp || keys.w) y -= 1;
    if (keys.ArrowDown || keys.s) y += 1;
    inp.x = x; inp.y = y;
  }

  function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

  function drawPartGlyph(slot, r) {
    // 머리는 세모, 팔은 막대, 다리는 점 둘. 색이 아니라 모양으로도 칸을 구별한다.
    ctx.beginPath();
    if (slot === 'head') { ctx.moveTo(0, -r); ctx.lineTo(r * 0.9, r * 0.7); ctx.lineTo(-r * 0.9, r * 0.7); ctx.closePath(); ctx.fill(); }
    else if (slot === 'arm') { ctx.rect(-r, -r * 0.3, r * 2, r * 0.6); ctx.fill(); }
    else { circle(-r * 0.55, 0, r * 0.4); ctx.fill(); circle(r * 0.55, 0, r * 0.4); ctx.fill(); }
  }

  function drawChimera(c) {
    const p = c.parts, k = 1 + (reduced ? 0 : c.pop * 0.9), r = c.r * k;
    // 늑대 다리는 달릴 때 잔상이 남는다
    if (p.leg === 'wolf' && c.down <= 0 && !reduced) {
      ctx.fillStyle = COL.wolf;
      for (const d of [0.7, 1.3]) { ctx.globalAlpha = 0.25 / d; circle(c.x - Math.cos(c.face) * d * r, c.y - Math.sin(c.face) * d * r, r * 0.8); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.globalAlpha = c.down > 0 ? 0.3 : 1;
    ctx.rotate(c.face);
    // 다리: 몸 아래에 깔린다
    if (p.leg === 'wolf') {
      ctx.fillStyle = COL.wolf;
      for (const [lx, ly] of [[-0.6, -0.8], [-0.6, 0.8], [0.5, -0.8], [0.5, 0.8]]) { ctx.beginPath(); ctx.ellipse(lx * r, ly * r, r * 0.42, r * 0.22, 0, 0, Math.PI * 2); ctx.fill(); }
    } else if (p.leg === 'knight') {
      ctx.strokeStyle = COL.knight; ctx.lineWidth = r * 0.34; circle(0, 0, r * 1.08); ctx.stroke();
    } else if (p.leg === 'archer') {
      ctx.strokeStyle = COL.archer; ctx.lineWidth = r * 0.16; ctx.lineCap = 'round';
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-r * 0.2, s * r * 0.6); ctx.lineTo(-r * 1.7, s * r * 1.1); ctx.stroke(); }
    }
    // 몸
    ctx.fillStyle = COL.bone; circle(0, 0, r); ctx.fill();
    ctx.strokeStyle = COL.ground; ctx.lineWidth = 0.06; ctx.stroke();
    // 몸에 찍힌 번호 점: 위쪽 표시의 몇 번째 키메라인지 알 수 있다
    ctx.fillStyle = COL.ground;
    for (let i = 0; i <= c.id; i++) { circle(-r * 0.45, (i - c.id / 2) * r * 0.36, r * 0.11); ctx.fill(); }
    // 팔
    if (p.arm === 'wolf') {
      ctx.fillStyle = COL.wolf;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(r * 0.2, s * r * 0.9); ctx.lineTo(r * 1.35, s * r * 1.0); ctx.lineTo(r * 0.5, s * r * 1.35); ctx.closePath(); ctx.fill(); }
    } else if (p.arm === 'knight') {
      ctx.strokeStyle = COL.knight; ctx.lineWidth = r * 0.3; ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.arc(0, 0, r * 1.3, -0.9, 0.9); ctx.stroke();
    } else if (p.arm === 'archer') {
      ctx.strokeStyle = COL.archer; ctx.lineWidth = r * 0.16;
      ctx.beginPath(); ctx.arc(r * 0.5, r * 1.0, r * 0.75, -1.2, 1.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(r * 0.77, r * 0.3); ctx.lineTo(r * 0.77, r * 1.7); ctx.stroke();
    }
    // 머리
    if (p.head === 'wolf') {
      ctx.fillStyle = COL.wolf;
      ctx.beginPath(); ctx.moveTo(r * 1.5, 0); ctx.lineTo(r * 0.5, r * 0.55); ctx.lineTo(r * 0.5, -r * 0.55); ctx.closePath(); ctx.fill();
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(r * 0.45, s * r * 0.25); ctx.lineTo(r * 0.2, s * r * 0.85); ctx.lineTo(r * 0.75, s * r * 0.5); ctx.closePath(); ctx.fill(); }
    } else if (p.head === 'knight') {
      ctx.fillStyle = COL.knight; ctx.fillRect(r * 0.35, -r * 0.5, r * 0.9, r);
      ctx.fillStyle = COL.ground; ctx.fillRect(r * 0.95, -r * 0.32, r * 0.12, r * 0.64);
    } else if (p.head === 'archer') {
      ctx.fillStyle = COL.archer; circle(r * 0.7, 0, r * 0.5); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r * 0.3, -r * 0.4); ctx.lineTo(-r * 0.3, 0); ctx.lineTo(r * 0.3, r * 0.4); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = COL.dim; circle(r * 0.55, 0, r * 0.28); ctx.fill();
    }
    ctx.restore();
    // 체력(다쳤을 때만)
    const mh = S.stats(c).maxHp;
    if (c.down <= 0 && c.hp < mh) bar(c.x, c.y - c.r - 0.45, 1.0, c.hp / mh, COL.bone);
    if (c.down > 0) {
      ctx.strokeStyle = COL.bone; ctx.lineWidth = 0.08;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 0.25, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - c.down / 6)); ctx.stroke();
    }
  }

  function bar(x, y, w, f, col) {
    ctx.fillStyle = COL.grid; ctx.fillRect(x - w / 2, y, w, 0.12);
    ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * Math.max(0, f), 0.12);
  }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.face);
    ctx.fillStyle = COL[e.type]; ctx.strokeStyle = COL.ground; ctx.lineWidth = 0.07;
    const r = e.r;
    ctx.beginPath();
    if (e.type === 'wolf') { ctx.moveTo(r * 1.3, 0); ctx.lineTo(-r, r * 0.85); ctx.lineTo(-r * 0.5, 0); ctx.lineTo(-r, -r * 0.85); ctx.closePath(); }
    else if (e.type === 'knight') { ctx.rect(-r, -r, r * 2, r * 2); }
    else { ctx.moveTo(r * 1.2, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 1.2, 0); ctx.lineTo(0, -r); ctx.closePath(); }
    ctx.fill(); ctx.stroke();
    ctx.restore();
    if (e.hp < e.maxHp) bar(e.x, e.y - e.r - 0.35, 0.9, e.hp / e.maxHp, COL.danger);
  }

  function draw(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = COL.ground; ctx.fillRect(0, 0, cv.width, cv.height);
    if (!g) return;
    const vh = cv.height / scale;
    camX = Math.max(0, Math.min(S.W - VIEW_W, g.necro.x - VIEW_W / 2));
    camY = vh >= S.H ? (S.H - vh) / 2 : Math.max(0, Math.min(S.H - vh, g.necro.y - vh / 2));
    ctx.setTransform(scale, 0, 0, scale, -camX * scale, -camY * scale);
    // 바닥: 판의 경계와 옅은 격자
    ctx.strokeStyle = COL.grid; ctx.lineWidth = 0.03;
    for (let x = 0; x <= S.W; x += 3) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, S.H); ctx.stroke(); }
    for (let y = 0; y <= S.H; y += 3) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(S.W, y); ctx.stroke(); }
    ctx.lineWidth = 0.08; ctx.strokeRect(0, 0, S.W, S.H);

    // 떨어진 부위
    for (const p of g.parts) {
      if (p.ttl < 3 && Math.floor(now / 120) % 2 === 0) continue;
      const pulse = reduced ? 1 : 1 + 0.12 * Math.sin(now / 160 + p.x);
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.strokeStyle = COL[p.type]; ctx.lineWidth = 0.12; circle(0, 0, 0.7 * pulse); ctx.stroke();
      ctx.fillStyle = COL[p.type]; drawPartGlyph(p.slot, 0.36);
      ctx.restore();
    }

    for (const e of g.enemies) drawEnemy(e);
    for (const c of g.chimeras) drawChimera(c);
    // 부위를 받을 키메라: 도는 점선 고리
    if (g.target !== null) {
      const c = g.chimeras[g.target];
      ctx.save(); ctx.strokeStyle = COL.necro; ctx.lineWidth = 0.12; ctx.setLineDash([0.35, 0.25]);
      ctx.lineDashOffset = reduced ? 0 : -now / 400;
      circle(c.x, c.y, c.r + 0.55); ctx.stroke(); ctx.restore();
    }

    // 네크로맨서
    const n = g.necro;
    ctx.fillStyle = n.hurt > 0 ? COL.danger : COL.necro;
    circle(n.x, n.y, n.r); ctx.fill();
    ctx.strokeStyle = COL.ink; ctx.lineWidth = 0.08; circle(n.x, n.y, n.r + 0.16); ctx.stroke();
    ctx.fillStyle = COL.ground; circle(n.x, n.y, 0.16); ctx.fill();

    // 효과
    for (const f of g.fx) {
      if (f.k === 'hit') {
        ctx.strokeStyle = f.bite || f.claw ? COL.wolf : COL.ink; ctx.lineWidth = f.bite || f.claw ? 0.14 : 0.08;
        circle(f.x, f.y, 0.25 + (0.15 - f.t) * (f.claw ? 6 : 3)); ctx.stroke();
      }
      else if (f.k === 'block') { ctx.strokeStyle = COL.knight; ctx.lineWidth = 0.22; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.5, f.face - 1.1, f.face + 1.1); ctx.stroke(); }
      else if (f.k === 'knock') { ctx.strokeStyle = COL.knight; ctx.lineWidth = 0.1; circle(f.x, f.y, f.r + 0.3 + (0.2 - f.t) * 5); ctx.stroke(); }
      else if (f.k === 'shot') { ctx.strokeStyle = COL[f.type]; ctx.lineWidth = f.type === 'archer' ? 0.16 : 0.07; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.tx, f.ty); ctx.stroke(); }
      else if (f.k === 'die') { ctx.strokeStyle = COL[f.type]; ctx.lineWidth = 0.1; circle(f.x, f.y, 0.4 + (0.35 - f.t) * 3); ctx.stroke(); }
      else if (f.k === 'attach') {
        const c = g.chimeras[f.id], col = COL[f.type] || COL.bone, k = 1 - f.t / 0.45;
        ctx.strokeStyle = col; ctx.lineWidth = 0.2;
        ctx.beginPath(); ctx.moveTo(f.x + (c.x - f.x) * k, f.y + (c.y - f.y) * k); ctx.lineTo(c.x, c.y); ctx.stroke();
        circle(c.x, c.y, c.r + 0.3 + k * 1.8); ctx.stroke();
        ctx.lineWidth = 0.08; circle(c.x, c.y, c.r + 0.3 + k * 3.2); ctx.stroke();
      }
      else if (f.k === 'heal') { ctx.strokeStyle = COL.necro; ctx.lineWidth = 0.1; circle(f.x, f.y, 0.7 + (0.4 - f.t) * 2); ctx.stroke(); }
      else if (f.k === 'down') { ctx.strokeStyle = COL.danger; ctx.lineWidth = 0.1; circle(f.x, f.y, 0.6 + (0.5 - f.t) * 2); ctx.stroke(); }
    }

    // 화면 고정 표시: 남은 시간, 네크로맨서 체력, 키메라 셋의 부위
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const w = cv.width / dpr, pad = 16;
    const bw = w - pad * 2;
    ctx.fillStyle = COL.grid; ctx.fillRect(pad, 12, bw, 6);
    ctx.fillStyle = COL.ink; ctx.fillRect(pad, 12, bw * (1 - g.t / S.DURATION), 6);
    ctx.fillStyle = COL.grid; ctx.fillRect(pad, 24, bw, 10);
    ctx.fillStyle = n.hp / n.maxHp < 0.3 ? COL.danger : COL.necro; ctx.fillRect(pad, 24, bw * n.hp / n.maxHp, 10);
    ctx.font = '600 14px ' + C('--font-body'); ctx.textBaseline = 'top'; ctx.fillStyle = COL.ink;
    ctx.textAlign = 'right'; ctx.fillText(Math.ceil(S.DURATION - g.t) + '초', w - pad, 48);
    ctx.textAlign = 'left';
    g.chimeras.forEach((c, i) => {
      const x0 = pad + i * 92, y0 = 56;
      ctx.globalAlpha = c.down > 0 ? 0.35 : 1;
      if (g.target === i) { ctx.strokeStyle = COL.necro; ctx.lineWidth = 2; ctx.strokeRect(x0 - 4, y0 - 15, 84, 30); }
      ctx.fillStyle = COL.bone; ctx.beginPath(); ctx.arc(x0 + 10, y0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COL.ground;
      for (let d = 0; d <= i; d++) { ctx.beginPath(); ctx.arc(x0 + 10 + (d - i / 2) * 6, y0, 2, 0, Math.PI * 2); ctx.fill(); }
      S.SLOTS.forEach((s, j) => {
        ctx.save(); ctx.translate(x0 + 34 + j * 18, y0);
        ctx.fillStyle = c.parts[s] ? COL[c.parts[s]] : COL.grid;
        drawPartGlyph(s, 7);
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    });

    // 조이스틱
    if (stick) {
      const r = cv.getBoundingClientRect();
      ctx.strokeStyle = COL.dim; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(stick.x0 - r.left, stick.y0 - r.top, 56, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = COL.dim; ctx.beginPath(); ctx.arc(stick.x0 - r.left + inp.x * 56, stick.y0 - r.top + inp.y * 56, 18, 0, Math.PI * 2); ctx.fill();
    }
  }

  function showEnd() {
    mode = 'over';
    document.getElementById('endTitle').textContent = g.over === 'win' ? '버텼다' : '쓰러졌다';
    document.getElementById('endTime').textContent = g.t.toFixed(0) + '초';
    document.getElementById('endKills').textContent = g.kills + '마리';
    document.getElementById('endParts').textContent = g.picked + '개';
    const ul = document.getElementById('endChimeras');
    ul.textContent = '';
    g.chimeras.forEach((c, i) => {
      const li = document.createElement('li');
      const got = S.SLOTS.filter(s => c.parts[s]).map(s => NAME[c.parts[s]] + ' ' + SLOT_NAME[s]);
      li.textContent = '키메라 ' + (i + 1) + ': ' + (got.length ? got.join(', ') : '맨몸');
      ul.appendChild(li);
    });
    endEl.hidden = false;
    document.getElementById('againBtn').focus();
  }

  function frame(now) {
    let dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    // 부위가 붙는 순간 잠깐 느려진다. 무엇이 어디에 붙었는지 볼 틈을 준다.
    if (g && g.picked !== lastPicked) { lastPicked = g.picked; if (!reduced) slow = 0.28; }
    if (slow > 0) { slow -= dt; dt *= 0.2; }
    if (mode === 'play') {
      readInput();
      S.step(g, dt, inp);
      if (g.over) showEnd();
    }
    draw(now);
    requestAnimationFrame(frame);
  }

  resize();
  g = S.newGame(seed);   // 제목 화면 뒤에 판의 첫 모습을 깔아 둔다
  requestAnimationFrame(frame);
})();

</script>
